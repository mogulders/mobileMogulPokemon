    <!--Contact Form-->
    <div class="contactForm">
      <form id="form" action="https://formspree.io/mogulders@gmail.com"
      method="POST">
        <fieldset id="contactFieldset">
          <legend id="fieldsetHeader">Contact Us</legend>
          <p>
            First Name:
            <input
              class="firstName"
              type="text"
              id="firstName"
              name="firstName"
              placeholder="First Name"
            />
          </p>

          <p>
            Last Name:
            <input
              class="lastName"
              type="text"
              id="lastName"
              name="lastName"
              placeholder="Last Name"
            />
          </p>

          <p>
            Email:
            <input
              class="email"
              type="Email"
              id="Email"
              name="email"
              placeholder="mogul@gmail.com"
            />
          </p>

          <p>Message:</p>
          <textarea
            class="message"
            id="comments"
            name="comments"
            cols="30"
            rows="3"
            placeholder="Comments..."
          ></textarea>
          <br />
          <!-- <input id="submit" type="SUBMIT" name="" value="submit" /> -->
          <button type="submit" value="send" class="submit">Send</button>
        </fieldset>
      </form>
    </div>
